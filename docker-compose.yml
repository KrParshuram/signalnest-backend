services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalnest
      POSTGRES_PASSWORD: signalnest_dev
      POSTGRES_DB: signalnest
    ports:
      - "5432:5432"
    volumes:
      - signalnest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalnest -d signalnest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - signalnest_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signalnest_pgdata:
  signalnest_redisdata:
