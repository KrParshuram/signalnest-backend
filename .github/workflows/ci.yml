name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signalnest
          POSTGRES_PASSWORD: signalnest_dev
          POSTGRES_DB: signalnest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalnest -d signalnest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://signalnest:signalnest_dev@localhost:5432/signalnest
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-which-is-longer-than-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-which-is-also-longer-than-32
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate schema against PostgreSQL
        run: npx prisma db push
      - name: Typecheck and build
        run: npm run build
      - name: Start feedback import worker
        run: |
          node dist/worker.js > /tmp/signalnest-worker.log 2>&1 &
          echo $! > /tmp/signalnest-worker.pid
          sleep 2
          if ! kill -0 "$(cat /tmp/signalnest-worker.pid)" 2>/dev/null; then
            cat /tmp/signalnest-worker.log
            exit 1
          fi
      - name: Run integration tests
        run: npm test
      - name: Print feedback worker logs on failure
        if: failure()
        run: cat /tmp/signalnest-worker.log || true
      - name: Stop feedback import worker
        if: always()
        run: if [ -f /tmp/signalnest-worker.pid ]; then kill "$(cat /tmp/signalnest-worker.pid)" || true; fi
